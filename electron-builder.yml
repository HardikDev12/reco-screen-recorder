appId: com.hardikprajapati.reco
productName: Reco
copyright: Copyright © 2026 Hardik Prajapati
compression: maximum

directories:
  output: release
  buildResources: asset

files:
  - dist-electron/**/*
  - dist/**/*
  - '!dist/**/*.map'
  - '!dist/win-unpacked/**'
  - '!dist/*.exe'
  - '!dist/*.zip'
  - '!dist/*.blockmap'
  - '!dist/builder-debug.yml'
  - '!dist/builder-effective-config.yaml'
  - asset/icon.png
  - asset/icon.ico

extraResources:
  - from: bin/win64/ffmpeg.exe
    to: bin/win64/ffmpeg.exe

win:
  icon: asset/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false

nsis:
  include: asset/installer.nsh
  artifactName: RECO-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Reco
  installerIcon: asset/icon.ico
  uninstallerIcon: asset/icon.ico
  uninstallDisplayName: Reco Screen Recorder
  deleteAppDataOnUninstall: true

portable:
  artifactName: RECO-Portable.${ext}

