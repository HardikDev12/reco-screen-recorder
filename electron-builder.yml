appId: com.hardikprajapati.reco
productName: Reco
copyright: Copyright © 2026 Hardik Prajapati

directories:
  output: dist
  buildResources: asset

files:
  - dist-electron/**/*
  - dist/**/*
  - asset/**/*
  - package.json

extraResources:
  - from: bin/win64
    to: bin/win64
    filter:
      - '**/*'

win:
  icon: asset/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false

nsis:
  artifactName: RECO-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Reco
  installerIcon: asset/icon.ico
  uninstallerIcon: asset/icon.ico
  uninstallDisplayName: Reco Screen Recorder

portable:
  artifactName: RECO-Portable.${ext}
