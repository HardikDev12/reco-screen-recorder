name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build & Security Validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Dependency security audit
        run: npm audit --omit=dev

      - name: Ensure FFmpeg binaries are ready
        run: node scripts/download-ffmpeg.js

      - name: Typecheck and compile Electron & Vite
        run: npm run build:electron

      - name: Package unpacked binary test
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO: 0
